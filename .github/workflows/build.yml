name: APK derle

on:
  push:
    branches: ["himican/**", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Google key (Maps + Navigation SDK) from the repo secret into the gitignored secrets.properties.
      # Without it the build still works and the app runs on its free stack (no Google, no Nav SDK).
      - name: Google API anahtarı
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > secrets.properties
            echo "MAPS_API_KEY: set (length ${#MAPS_API_KEY})"
          else
            echo "MAPS_API_KEY: not set"
          fi

      # standardDebug = com.wayfindr.app.preview, same variant as the v34-v40 APKs.
      - name: APK derle (standard, debug)
        run: ./gradlew --no-daemon assembleStandardDebug

      # Ride recording + GPX import (incl. the real Super TripperDash exports in test/resources/gpx).
      - name: Sürüş birim testleri
        # Older tests outside data/ no longer compile (e.g. MbTiles was removed), so only data/ is built here.
        run: |
          find app/src/test/java -name '*.kt' ! -path '*/wayfindr/data/*' ! -name 'GoogleNavManeuverTest.kt' -delete
          ./gradlew --no-daemon testStandardDebugUnitTest --tests 'com.example.wayfindr.data.*' --tests 'com.example.wayfindr.dash.nav.GoogleNavManeuverTest'

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: apk

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # google_apis x86_64 images run arm64-v8a apps through native-bridge translation,
      # so the exact arm64-only APK is tested.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Room for the full Türkiye offline package (~1.1 GB) downloaded in smoke.sh.
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh "$(find apk -name '*.apk' | head -1)"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_number }}
          path: smoke-out
          retention-days: 14
